<text x="1450" y="1850" font-size="23" font-weight="400" fill="#52647B">Thực hiện tác vụ trong domain được giao.</text>
<text x="60" y="1925" font-size="22" font-weight="400" fill="#64748B">Các database là quyền sở hữu logic riêng; không bắt buộc mỗi DB là một máy chủ. HTTPS liên service và các workflow khác được lược để làm rõ kiến trúc.</text>
