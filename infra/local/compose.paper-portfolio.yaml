# Add after compose.yaml and compose.hybrid-forward.yaml on the full-data stack.
services:
  hybrid-forward-capture:
    environment:
      GOLD_SHADOW_CAPTURE_EXTENSION: "1"

  paper-market-export:
    image: portfolio-hybrid-forward-study:local
    user: "${LOCAL_BUNDLE_UID:?Run bootstrap.py}:${LOCAL_BUNDLE_GID:?Run bootstrap.py}"
    entrypoint: [python, -m, scripts.paper_market_export]
    command: [--archive, /archive, --output, /paper-market, --scheduled]
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ../../output/hybrid-mvo60-forward:/archive:ro
      - ../../output/paper-market:/paper-market:rw
      - ../../scripts/paper_market_export.py:/study/scripts/paper_market_export.py:ro
      - ../../scripts/gold_shadow_marks.py:/study/scripts/gold_shadow_marks.py:ro
      - ../../scripts/hybrid_forward_panel.py:/study/scripts/hybrid_forward_panel.py:ro
      - ../../services/quant-serving/src/quant_service/gold_shadow_quotes.py:/study/services/quant-serving/src/quant_service/gold_shadow_quotes.py:ro
    restart: unless-stopped

  paper-portfolio-worker:
    image: portfolio-software-portfolio:local
    command: [python, -m, portfolio_service.paper_worker]
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio_runtime:${PORTFOLIO_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/portfolio_db
    volumes:
      - ../../output/paper-market:/paper-market:ro
    depends_on:
      portfolio-migrate: {condition: service_completed_successfully}
    restart: unless-stopped
