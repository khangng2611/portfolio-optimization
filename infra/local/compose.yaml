name: portfolio-auth-demo

x-portfolio-environment: &portfolio-environment
  HYBRID_LOCAL_RETROSPECTIVE_POLICY: ${HYBRID_LOCAL_RETROSPECTIVE_POLICY:-}
  SYSTEM_HYBRID_ENABLED: ${SYSTEM_HYBRID_ENABLED:-paused}
  USER_SELECTED_ASSETS_ENABLED: ${USER_SELECTED_ASSETS_ENABLED:-false}
  DATABASE_URL: postgresql+psycopg://portfolio_runtime:${PORTFOLIO_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/portfolio_db
  OIDC_ISSUER: http://auth-api:8000
  OIDC_JWKS_URL: http://auth-api:8000/.well-known/jwks.json
  OIDC_AUDIENCE: portfolio-api
  OIDC_TOKEN_URL: http://auth-api:8000/internal/v1/token
  AUTH_ACCOUNT_STATUS_URL: http://auth-api:8000/internal/v1/accounts
  AUTH_ACCOUNT_READER_SECRET: ${PORTFOLIO_ACCOUNT_READER_SECRET:?Run bootstrap.py}
  QUANT_API_URL: http://quant-api:8000
  QUANT_CLIENT_SECRET: ${QUANT_CLIENT_SECRET:?Run bootstrap.py}

x-quant-environment: &quant-environment
  USER_SELECTED_ASSETS_ENABLED: ${USER_SELECTED_ASSETS_ENABLED:-false}
  DATABASE_URL: postgresql+psycopg://quant_runtime:${QUANT_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/quant_db
  OIDC_ISSUER: http://auth-api:8000
  OIDC_JWKS_URL: http://auth-api:8000/.well-known/jwks.json
  OIDC_AUDIENCE: quant-api
  BUNDLE_DIRECTORY: /bundles
  ALLOW_DEMO_INPUTS: "true"
  OIDC_TOKEN_URL: http://auth-api:8000/internal/v1/token
  ML_API_URL: http://ml-api:8000
  ML_READER_CLIENT_SECRET: ${ML_READER_CLIENT_SECRET:?Run bootstrap.py}

x-market-environment: &market-environment
  DATABASE_URL: postgresql+psycopg://market_runtime:${MARKET_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/market_db
  OIDC_ISSUER: http://auth-api:8000
  OIDC_JWKS_URL: http://auth-api:8000/.well-known/jwks.json
  OIDC_AUDIENCE: market-api
  DATASET_DIRECTORY: /datasets

x-ml-environment: &ml-environment
  DATABASE_URL: postgresql+psycopg://ml_runtime:${ML_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/ml_db
  OIDC_ISSUER: http://auth-api:8000
  OIDC_JWKS_URL: http://auth-api:8000/.well-known/jwks.json
  OIDC_AUDIENCE: ml-api
  ML_ARTIFACT_DIRECTORY: /ml-models

x-chat-environment: &chat-environment
  SYSTEM_HYBRID_ENABLED: ${SYSTEM_HYBRID_ENABLED:-paused}
  DATABASE_URL: postgresql+psycopg://chat_runtime:${CHAT_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/chat_db
  OIDC_ISSUER: http://auth-api:8000
  OIDC_JWKS_URL: http://auth-api:8000/.well-known/jwks.json
  OIDC_AUDIENCE: chat-api
  OIDC_TOKEN_URL: http://auth-api:8000/internal/v1/token
  CHAT_CLIENT_SECRET: ${CHAT_CLIENT_SECRET:?Run bootstrap.py}
  PORTFOLIO_API_URL: http://portfolio-api:8000
  MARKET_API_URL: http://market-api:8000
  KNOWLEDGE_API_URL: http://knowledge-api:8000

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 15s

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap.py}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.generated/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U local_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./.generated/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8.2.10-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run bootstrap.py}
    ports: ["127.0.0.1:6380:6379"]
    volumes:
      - redis-data:/data
      - ./.generated/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-migrate:
    build: {context: ../.., dockerfile: services/auth/Dockerfile}
    image: portfolio-auth-demo-auth:local
    command: ["/bin/sh", "-ec", "alembic -c /app/services/auth/alembic.ini upgrade head && python -m auth_service.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://auth_migrator:${AUTH_MIGRATOR_PASSWORD:?Run bootstrap.py}@postgres:5432/auth_db
      AUTH_SEED_ACCOUNTS_B64: ${AUTH_SEED_ACCOUNTS_B64:?Run bootstrap.py}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  auth-api:
    build: {context: ../.., dockerfile: services/auth/Dockerfile}
    image: portfolio-auth-demo-auth:local
    environment:
      DATABASE_URL: postgresql+psycopg://auth_runtime:${AUTH_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/auth_db
      OIDC_ISSUER: http://auth-api:8000
      AUTH_SIGNING_KEY_B64: ${AUTH_SIGNING_KEY_B64:?Run bootstrap.py}
      AUTH_WEB_SECRET: ${AUTH_WEB_SECRET:?Run bootstrap.py}
      PORTFOLIO_ACCOUNT_READER_SECRET: ${PORTFOLIO_ACCOUNT_READER_SECRET:?Run bootstrap.py}
      QUANT_CLIENT_SECRET: ${QUANT_CLIENT_SECRET:?Run bootstrap.py}
      MARKET_READER_CLIENT_SECRET: ${MARKET_READER_CLIENT_SECRET:?Run bootstrap.py}
      ML_MARKET_READER_CLIENT_SECRET: ${ML_MARKET_READER_CLIENT_SECRET:?Run bootstrap.py}
      ML_READER_CLIENT_SECRET: ${ML_READER_CLIENT_SECRET:?Run bootstrap.py}
      CHAT_CLIENT_SECRET: ${CHAT_CLIENT_SECRET:?Run bootstrap.py}
    depends_on:
      auth-migrate: {condition: service_completed_successfully}
    healthcheck: *api-healthcheck
    restart: unless-stopped

  portfolio-migrate:
    build: {context: ../.., dockerfile: services/portfolio/Dockerfile}
    image: portfolio-software-portfolio:local
    command: ["alembic", "-c", "/app/services/portfolio/alembic.ini", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://portfolio_migrator:${PORTFOLIO_MIGRATOR_PASSWORD:?Run bootstrap.py}@postgres:5432/portfolio_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  quant-migrate:
    build: {context: ../.., dockerfile: services/quant-serving/Dockerfile}
    image: portfolio-software-quant:local
    command: ["alembic", "-c", "/app/services/quant-serving/alembic.ini", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://quant_migrator:${QUANT_MIGRATOR_PASSWORD:?Run bootstrap.py}@postgres:5432/quant_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  market-migrate:
    build: {context: ../.., dockerfile: services/market-data/Dockerfile}
    image: portfolio-software-market:local
    command: ["alembic", "-c", "/app/services/market-data/alembic.ini", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://market_migrator:${MARKET_MIGRATOR_PASSWORD:?Run bootstrap.py}@postgres:5432/market_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  knowledge-postgres:
    build: {context: ./knowledge-postgres}
    image: portfolio-software-knowledge-postgres:pg17-vector081
    environment:
      POSTGRES_USER: knowledge_admin
      POSTGRES_PASSWORD: ${KNOWLEDGE_ADMIN_PASSWORD:?Run bootstrap.py}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - knowledge-data:/var/lib/postgresql/data
      - ./.generated/knowledge-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U knowledge_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  knowledge-migrate:
    build: {context: ../.., dockerfile: services/knowledge/Dockerfile}
    image: portfolio-software-knowledge:local
    command: ["alembic", "-c", "/app/services/knowledge/alembic.ini", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://knowledge_migrator:${KNOWLEDGE_MIGRATOR_PASSWORD:?Run bootstrap.py}@knowledge-postgres:5432/knowledge_db
    depends_on:
      knowledge-postgres: {condition: service_healthy}

  knowledge-api:
    image: portfolio-software-knowledge:local
    environment: &knowledge-environment
      DATABASE_URL: postgresql+psycopg://knowledge_runtime:${KNOWLEDGE_RUNTIME_PASSWORD:?Run bootstrap.py}@knowledge-postgres:5432/knowledge_db
      OIDC_ISSUER: http://auth-api:8000
      OIDC_JWKS_URL: http://auth-api:8000/.well-known/jwks.json
      OIDC_AUDIENCE: knowledge-api
    ports: ["127.0.0.1:8006:8000"]
    depends_on:
      knowledge-migrate: {condition: service_completed_successfully}
    healthcheck: *api-healthcheck
    restart: unless-stopped

  knowledge-worker:
    image: portfolio-software-knowledge:local
    command: ["python", "-m", "knowledge_service.worker"]
    environment: *knowledge-environment
    depends_on:
      knowledge-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "from knowledge_service.runtime import sessions_from_env; from sqlalchemy import text; s=sessions_from_env()(); s.execute(text('SELECT id FROM indexing_job LIMIT 1')); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  chat-migrate:
    build: {context: ../.., dockerfile: services/chat/Dockerfile}
    image: portfolio-software-chat:local
    command: ["alembic", "-c", "/app/services/chat/alembic.ini", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://chat_migrator:${CHAT_MIGRATOR_PASSWORD:?Run bootstrap.py}@postgres:5432/chat_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  chat-api:
    image: portfolio-software-chat:local
    environment: *chat-environment
    ports: ["127.0.0.1:8005:8000"]
    depends_on:
      chat-migrate: {condition: service_completed_successfully}
      auth-api: {condition: service_healthy}
    healthcheck: *api-healthcheck
    restart: unless-stopped

  chat-worker:
    image: portfolio-software-chat:local
    command: ["python", "-m", "chat_service.worker"]
    environment: *chat-environment
    healthcheck:
      test: ["CMD", "python", "-c", "import chat_service.worker; from chat_service.runtime import sessions_from_env; from sqlalchemy import text; s=sessions_from_env()(); s.execute(text('SELECT id FROM chat_job LIMIT 1')); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      chat-migrate: {condition: service_completed_successfully}
      portfolio-api: {condition: service_healthy}
      market-api: {condition: service_healthy}
      auth-api: {condition: service_healthy}
    restart: unless-stopped

  ml-migrate:
    build: {context: ../.., dockerfile: services/ml-platform/Dockerfile}
    image: portfolio-software-ml:local
    command: ["alembic", "-c", "/app/services/ml-platform/alembic.ini", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://ml_migrator:${ML_MIGRATOR_PASSWORD:?Run bootstrap.py}@postgres:5432/ml_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  ml-api:
    image: portfolio-software-ml:local
    environment: *ml-environment
    ports: ["127.0.0.1:8004:8000"]
    volumes: ["./.generated/ml-models:/ml-models:ro"]
    depends_on:
      ml-migrate: {condition: service_completed_successfully}
      auth-api: {condition: service_healthy}
    healthcheck: *api-healthcheck
    restart: unless-stopped

  ml-worker:
    image: portfolio-software-ml:local
    user: "${LOCAL_BUNDLE_UID:?Run bootstrap.py}:${LOCAL_BUNDLE_GID:?Run bootstrap.py}"
    command: ["python", "-m", "ml_platform.worker"]
    environment:
      <<: *ml-environment
      OIDC_TOKEN_URL: http://auth-api:8000/internal/v1/token
      MARKET_API_URL: http://market-api:8000
      ML_MARKET_READER_CLIENT_SECRET: ${ML_MARKET_READER_CLIENT_SECRET:?Run bootstrap.py}
    volumes: ["./.generated/ml-models:/ml-models:rw"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; import ml_platform.worker; from ml_platform.runtime import sessions_from_env; from sqlalchemy import text; s=sessions_from_env()(); s.execute(text('SELECT id FROM ml_training_job LIMIT 1')); s.close(); assert os.access('/ml-models', os.W_OK)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      ml-migrate: {condition: service_completed_successfully}
      market-api: {condition: service_healthy}
      auth-api: {condition: service_healthy}
    restart: unless-stopped

  market-metadata-sync:
    profiles: ["metadata"]
    image: portfolio-software-market:local
    command: ["python", "-m", "market_service.asset_metadata"]
    environment:
      <<: *market-environment
      FHSC_API_KEY: ${FHSC_API_KEY:-}
    depends_on:
      market-migrate: {condition: service_completed_successfully}
    restart: "no"

  market-api:
    image: portfolio-software-market:local
    environment: *market-environment
    ports: ["127.0.0.1:8003:8000"]
    volumes: ["./.generated/datasets:/datasets:ro", "./.generated/datasets/refresh:/datasets/refresh:ro"]
    depends_on:
      market-migrate: {condition: service_completed_successfully}
      auth-api: {condition: service_healthy}
    healthcheck: *api-healthcheck
    restart: unless-stopped

  market-dispatch:
    image: portfolio-software-market:local
    command: ["python", "-m", "market_service.worker", "dispatch"]
    environment:
      <<: *market-environment
      BROKER_URL: amqp://market_publisher:${MARKET_PUBLISHER_PASSWORD:?Run bootstrap.py}@rabbitmq:5672/portfolio
    volumes: ["./.generated/datasets:/datasets:ro", "./.generated/datasets/refresh:/datasets/refresh:ro"]
    depends_on:
      market-migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  market-consume:
    image: portfolio-software-market:local
    command: ["python", "-m", "market_service.worker", "consume"]
    environment:
      <<: *market-environment
      BROKER_URL: amqp://market_consumer:${MARKET_CONSUMER_PASSWORD:?Run bootstrap.py}@rabbitmq:5672/portfolio
    volumes: ["./.generated/datasets:/datasets:ro", "./.generated/datasets/refresh:/datasets/refresh:ro"]
    depends_on:
      market-migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  market-refresh:
    image: portfolio-software-market:local
    user: "${LOCAL_BUNDLE_UID:?Run bootstrap.py}:${LOCAL_BUNDLE_GID:?Run bootstrap.py}"
    command: ["python", "-m", "market_service.refresh_worker"]
    environment:
      <<: *market-environment
      REFRESH_ARTIFACT_DIRECTORY: /datasets/refresh
    volumes: ["./.generated/datasets:/datasets:ro", "./.generated/datasets/refresh:/datasets/refresh:rw"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; import market_service.refresh_worker; from market_service.runtime import sessions_from_env; from sqlalchemy import text; s=sessions_from_env()(); s.execute(text('SELECT id FROM refresh_job LIMIT 1')); s.close(); assert os.access('/datasets/refresh', os.W_OK) and not os.access('/datasets', os.W_OK)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      market-migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  portfolio-api:
    image: portfolio-software-portfolio:local
    environment: *portfolio-environment
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      portfolio-migrate: {condition: service_completed_successfully}
      auth-api: {condition: service_healthy}
      quant-api: {condition: service_healthy}
    healthcheck: *api-healthcheck
    restart: unless-stopped

  quant-api:
    image: portfolio-software-quant:local
    environment: *quant-environment
    ports: ["127.0.0.1:8002:8000"]
    volumes: ["./.generated/bundles:/bundles:ro", "./.generated/ml-models:/bundles/ml-models:ro"]
    depends_on:
      quant-migrate: {condition: service_completed_successfully}
      auth-api: {condition: service_healthy}
    healthcheck: *api-healthcheck
    restart: unless-stopped

  quant-publication:
    image: portfolio-software-quant:local
    user: "${LOCAL_BUNDLE_UID:?Run bootstrap.py}:${LOCAL_BUNDLE_GID:?Run bootstrap.py}"
    command: ["python", "-m", "quant_service.publication_worker", "run"]
    environment:
      DATABASE_URL: postgresql+psycopg://quant_runtime:${QUANT_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/quant_db
      BUNDLE_DIRECTORY: /bundles
      OIDC_TOKEN_URL: http://auth-api:8000/internal/v1/token
      MARKET_API_URL: http://market-api:8000
      MARKET_READER_CLIENT_SECRET: ${MARKET_READER_CLIENT_SECRET:?Run bootstrap.py}
      PUBLICATION_SCHEDULES: "[]"
    volumes: ["./.generated/bundles:/bundles:rw", "./.generated/ml-models:/bundles/ml-models:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; import quant_service.publication_worker; from quant_service.runtime import sessions_from_env; from sqlalchemy import text; s=sessions_from_env()(); s.execute(text('SELECT id FROM publication_job LIMIT 1')); s.close(); assert os.access('/bundles', os.W_OK)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      quant-migrate: {condition: service_completed_successfully}
      market-api: {condition: service_healthy}
      auth-api: {condition: service_healthy}
    restart: unless-stopped

  portfolio-dispatch:
    image: portfolio-software-portfolio:local
    command: ["python", "-m", "portfolio_service.worker", "dispatch"]
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio_runtime:${PORTFOLIO_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/portfolio_db
      BROKER_URL: amqp://portfolio_publisher:${PORTFOLIO_PUBLISHER_PASSWORD:?Run bootstrap.py}@rabbitmq:5672/portfolio
    depends_on:
      portfolio-migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  portfolio-consume:
    image: portfolio-software-portfolio:local
    command: ["python", "-m", "portfolio_service.worker", "consume"]
    environment:
      OIDC_TOKEN_URL: http://auth-api:8000/internal/v1/token
      QUANT_API_URL: http://quant-api:8000
      QUANT_CLIENT_SECRET: ${QUANT_CLIENT_SECRET:?Run bootstrap.py}
      DATABASE_URL: postgresql+psycopg://portfolio_runtime:${PORTFOLIO_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/portfolio_db
      BROKER_URL: amqp://portfolio_consumer:${PORTFOLIO_CONSUMER_PASSWORD:?Run bootstrap.py}@rabbitmq:5672/portfolio
    depends_on:
      portfolio-migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  quant-dispatch:
    image: portfolio-software-quant:local
    command: ["python", "-m", "quant_service.worker", "dispatch"]
    environment:
      <<: *quant-environment
      BROKER_URL: amqp://quant_publisher:${QUANT_PUBLISHER_PASSWORD:?Run bootstrap.py}@rabbitmq:5672/portfolio
    volumes: ["./.generated/bundles:/bundles:ro", "./.generated/ml-models:/bundles/ml-models:ro"]
    depends_on:
      quant-migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  quant-consume:
    image: portfolio-software-quant:local
    command: ["python", "-m", "quant_service.worker", "consume"]
    environment:
      <<: *quant-environment
      BROKER_URL: amqp://quant_consumer:${QUANT_CONSUMER_PASSWORD:?Run bootstrap.py}@rabbitmq:5672/portfolio
    volumes: ["./.generated/bundles:/bundles:ro", "./.generated/ml-models:/bundles/ml-models:ro"]
    depends_on:
      quant-migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  web:
    build: {context: ../../apps/web, dockerfile: Dockerfile}
    image: portfolio-software-web:local
    environment:
      APP_ORIGIN: http://localhost:3000
      OIDC_ISSUER: http://auth-api:8000
      AUTH_API_URL: http://auth-api:8000
      AUTH_WEB_SECRET: ${AUTH_WEB_SECRET:?Run bootstrap.py}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run bootstrap.py}@redis:6379/0
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Run bootstrap.py}
      PORTFOLIO_API_URL: http://portfolio-api:8000
      MARKET_API_URL: http://market-api:8000
      QUANT_API_URL: http://quant-api:8000
      ML_API_URL: http://ml-api:8000
      CHAT_API_URL: http://chat-api:8000
      KNOWLEDGE_API_URL: http://knowledge-api:8000
      ALLOW_INSECURE_HTTP: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      portfolio-api: {condition: service_healthy}
      auth-api: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  knowledge-data:
  postgres-data:
  rabbitmq-data:
  redis-data:
