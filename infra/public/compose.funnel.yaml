# Public HTTPS is terminated by tailscaled on the VPS; Docker stays loopback-only.
services:
  web:
    environment:
      APP_ORIGIN: ${DEMO_PUBLIC_ORIGIN:?Set the HTTPS Tailscale Funnel origin}
      # Internal Auth still uses HTTP; secure cookies follow the HTTPS APP_ORIGIN.
  portfolio-api:
    environment:
      # The public smoke profile uses explicit DEMO strategies.
      SYSTEM_HYBRID_ENABLED: "false"
    volumes: ["./.generated/paper-feed/quotes:/paper-market:ro"]
  chat-api:
    environment:
      SYSTEM_HYBRID_ENABLED: "false"
  chat-worker:
    environment:
      SYSTEM_HYBRID_ENABLED: "false"
  hybrid-forward-capture:
    image: portfolio-software-market:local
    user: "${LOCAL_BUNDLE_UID:?Run bootstrap.py}:${LOCAL_BUNDLE_GID:?Run bootstrap.py}"
    command:
      - python
      - -m
      - market_service.hybrid_forward_capture
      - --scheduled
      - --gold-shadow-extension
      - --directory
      - /archive
      - --gold-seed
      - /archive/setup/gold-warmup.csv
      - --protocol
      - /archive/setup/protocol.md
    volumes: ["./.generated/paper-feed/archive:/archive:rw"]
    restart: unless-stopped
  paper-market-export:
    image: portfolio-software-quant:local
    user: "${LOCAL_BUNDLE_UID:?Run bootstrap.py}:${LOCAL_BUNDLE_GID:?Run bootstrap.py}"
    environment:
      PYTHONPATH: /paper:/paper/market
    command: [python, -m, scripts.paper_market_export, --archive, /archive, --output, /paper-market, --scheduled]
    networks: [paper-export]
    read_only: true
    volumes:
      - ./.generated/paper-feed/archive:/archive:ro
      - ./.generated/paper-feed/quotes:/paper-market:rw
      - ../../scripts:/paper/scripts:ro
      - ../../services/market-data/src:/paper/market:ro
    restart: unless-stopped
  paper-portfolio-worker:
    image: portfolio-software-portfolio:local
    command: [python, -m, portfolio_service.paper_worker]
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio_runtime:${PORTFOLIO_RUNTIME_PASSWORD:?Run bootstrap.py}@postgres:5432/portfolio_db
    volumes: ["./.generated/paper-feed/quotes:/paper-market:ro"]
    depends_on:
      portfolio-migrate: {condition: service_completed_successfully}
    restart: unless-stopped
networks:
  paper-export:
    internal: true
