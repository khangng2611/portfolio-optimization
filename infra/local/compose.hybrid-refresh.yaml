services:
  hybrid-market-refresh:
    extends: {file: compose.yaml, service: market-refresh}
    command: [python, -m, market_service.hybrid_refresh]
    volumes:
      - ../../services/market-data/src/market_service/hybrid_refresh.py:/usr/local/lib/python3.12/site-packages/market_service/hybrid_refresh.py:ro
      - ../../services/market-data/src/market_service/selected_refresh.py:/usr/local/lib/python3.12/site-packages/market_service/selected_refresh.py:ro
    healthcheck: {disable: true}
  hybrid-snapshot-publication:
    extends: {file: compose.yaml, service: quant-publication}
    command: [python, -m, quant_service.hybrid_renewal]
    environment:
      ML_API_URL: http://ml-api:8000
      ML_READER_CLIENT_SECRET: ${ML_READER_CLIENT_SECRET:?Run bootstrap.py}
    volumes:
      - ../../services/quant-serving/src/quant_service/hybrid_renewal.py:/usr/local/lib/python3.12/site-packages/quant_service/hybrid_renewal.py:ro
      - ./.generated/datasets/refresh:/refresh:ro
      - ./.generated/bundles:/bundles:ro
    healthcheck: {disable: true}
